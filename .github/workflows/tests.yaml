name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported release: Home Assistant 2026.1.0.
          - python: "3.13"
            phcc: "0.13.305"
          # Latest release with a published test harness.
          - python: "3.14"
            phcc: "0.13.375"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      # Home Assistant reads its service descriptions only with the requirements a real
      # installation has; the test harness lacks them (see the script).
      - name: Install what Home Assistant needs to read service descriptions
        run: |
          python .github/scripts/base_requirements.py > base-requirements.txt
          cat base-requirements.txt
          constraints="$(python -c 'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / "package_constraints.txt")')"
          pip install -r base-requirements.txt -c "$constraints"
      - name: Run tests
        run: python -m pytest
